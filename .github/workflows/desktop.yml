name: desktop

# Builds the desktop apps and keeps the packages as workflow artifacts
# (Actions → the run → Artifacts):
#   Linux:   .tar.gz (with install.sh), .deb, AppImage
#   macOS:   .dmg, .zip
#   Windows: installer .exe (Inno Setup), portable .zip
# Runs when app/ changes, on demand from the Actions tab, and from release.yml,
# which attaches the same files to the GitHub Release.

on:
  push:
    branches: [main, master, v1, v2, v3]
    paths: ["app/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label used in file names (default: dev-<short sha>)"
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version label used in file names, e.g. v0.1.0"
        required: false
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Version label
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        env:
          REQUESTED: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          v="${REQUESTED:-dev-${SHA::7}}"
          # Keep it safe for file names (branch names can contain "/").
          v="$(printf '%s' "$v" | tr -c 'A-Za-z0-9._-' '-')"
          echo "value=$v" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev imagemagick
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter create --platforms=linux --org com.gpix --project-name gpix_app .
          bash tool/setup_linux.sh
          flutter pub get
          flutter build linux --release
      - name: Package (tar.gz, .deb, AppImage)
        working-directory: app
        run: bash tool/package_linux.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: app/out/*
          if-no-files-found: error

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build app + .dmg
        working-directory: app
        # Generates macos/, adds the sandbox entitlements (network + file
        # dialogs) and the gpix icon, builds release, and writes build/gpix.dmg.
        run: bash tool/build_macos_dmg.sh
      - name: Package
        working-directory: app
        # The .dmg is the only macOS download; the release attaches it as is.
        run: |
          mkdir -p out
          cp build/gpix.dmg "out/gpix_${VERSION}_macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: app/out/*
          if-no-files-found: error

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        shell: bash
        run: |
          flutter create --platforms=windows --org com.gpix --project-name gpix_app .
          bash tool/setup_windows.sh
          bash tool/apply_icons.sh
          flutter build windows --release
      - name: Install Inno Setup 6.3+
        shell: pwsh
        # "upgrade" installs it when missing and updates an older runner copy.
        run: choco upgrade innosetup -y --no-progress
      - name: Package (installer + zip)
        working-directory: app
        shell: pwsh
        run: ./tool/package_windows.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: app/out/*
          if-no-files-found: error
