name: release

# Builds cross-platform artifacts and publishes them to a GitHub Release.
# Trigger by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# (or run manually from the Actions tab).
#
#   Server (Go):  linux/macos/windows, amd64 + arm64 — cross-compiled from one
#                 Linux runner (the server is pure-Go / CGO-free).
#   App (Flutter): Android APK, plus the Linux, macOS and Windows desktop
#                 packages built by desktop.yml.
#   iOS is not built here — the App Store / device install needs code signing.
#   The Docker image for the same tag is published by docker.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create releases + upload assets

jobs:
  # ---------------------------------------------------------------- Go server
  server:
    name: Server binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            export GOOS="${t%/*}" GOARCH="${t#*/}" CGO_ENABLED=0
            bin="gpix"; [ "$GOOS" = "windows" ] && bin="gpix.exe"
            echo "→ $GOOS/$GOARCH"
            go build -trimpath -ldflags "-s -w" -o "$bin" .
            name="gpix_${VERSION}_${GOOS}_${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              zip -q "dist/${name}.zip" "$bin" README.md LICENSE
            else
              tar -czf "dist/${name}.tar.gz" "$bin" README.md LICENSE
            fi
            rm -f "$bin"
          done
          ( cd dist && sha256sum gpix_* > checksums-server.txt )
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/*

  # ------------------------------------------------------------- Android (APK)
  app-android:
    name: App · Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK
        working-directory: app
        run: |
          flutter create --platforms=android --org com.gpix --project-name gpix_app .
          flutter pub get
          bash tool/apply_icons.sh
          flutter build apk --release
      - name: Stage
        working-directory: app
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             "out/gpix_${GITHUB_REF_NAME:-dev}_android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: app/out/*

  # ------------------------------------- desktop apps (Linux, macOS, Windows)
  desktop:
    name: App · Desktop
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ github.ref_name }}

  # ------------------------------------------------------- publish the release
  publish:
    name: Publish release
    needs: [server, app-android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            Automated cross-platform build for `${{ github.ref_name }}`.

            **Server (Go)** — `gpix_<ver>_<os>_<arch>.tar.gz` / `.zip` for Linux, macOS, and Windows (amd64 + arm64). Verify downloads against `checksums-server.txt`.

            **Docker** — `docker pull ghcr.io/${{ github.repository_owner }}/gpix:latest` (linux/amd64 + linux/arm64; the version tag drops the leading `v`).

            **App (Flutter)**
            - `..._android.apk` — sideload on Android (enable "install unknown apps").
            - `..._windows-x64-setup.exe` — installer (Start-menu shortcut, per-user by default). `..._windows-x64.zip` is the portable build. Unsigned, so SmartScreen may warn: **More info → Run anyway**.
            - `..._amd64.deb` — `sudo apt install ./gpix_..._amd64.deb`, then launch "gpix" from the app menu (or run `gpix-app`).
            - `..._linux-x64.AppImage` — `chmod +x` and run (needs GTK 3 on the host).
            - `..._linux-x64.tar.gz` — extract and run `./install.sh` for a per-user install with menu entry and icon.
            - `..._macos.dmg` — open and drag gpix_app to Applications. `..._macos.zip` is the same app zipped. Unsigned; first launch: right-click → **Open**, or `xattr -dr com.apple.quarantine /Applications/gpix_app.app`.

            iOS isn't included (requires code signing). Build it locally per `app/README.md`.
