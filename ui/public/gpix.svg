<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- gpix app icon, web logo + favicon (same design as app/assets/icon/gpix.svg). Render with tool/render_icons.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f82ff"/>
      <stop offset="1" stop-color="#7c4de6"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cddcff"/>
      <stop offset="1" stop-color="#f1eaff"/>
    </linearGradient>
    <clipPath id="photo"><circle cx="512" cy="512" r="232"/></clipPath>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="flowerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#1d1366" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#shine)"/>

  <g transform="translate(512 512) scale(1.12) translate(-512 -512)">
    <g filter="url(#flowerShadow)">
      <!-- back petals, offset half a step -->
      <g fill="#ffffff" fill-opacity="0.5">
        <circle cx="701.4" cy="590.5" r="118"/>
        <circle cx="590.5" cy="701.4" r="118"/>
        <circle cx="433.5" cy="701.4" r="118"/>
        <circle cx="322.6" cy="590.5" r="118"/>
        <circle cx="322.6" cy="433.5" r="118"/>
        <circle cx="433.5" cy="322.6" r="118"/>
        <circle cx="590.5" cy="322.6" r="118"/>
        <circle cx="701.4" cy="433.5" r="118"/>
      </g>
      <!-- front petals -->
      <g fill="#ffffff">
        <circle cx="712" cy="512" r="130"/>
        <circle cx="653.4" cy="653.4" r="130"/>
        <circle cx="512" cy="712" r="130"/>
        <circle cx="370.6" cy="653.4" r="130"/>
        <circle cx="312" cy="512" r="130"/>
        <circle cx="370.6" cy="370.6" r="130"/>
        <circle cx="512" cy="312" r="130"/>
        <circle cx="653.4" cy="370.6" r="130"/>
        <circle cx="512" cy="512" r="250"/>
      </g>
    </g>

    <!-- the photo -->
    <g clip-path="url(#photo)">
      <rect x="270" y="270" width="484" height="484" fill="url(#sky)"/>
      <circle cx="598" cy="428" r="50" fill="#ffc857"/>
      <path d="M250 760 L428 486 L522 598 L604 512 L780 760 Z" fill="#7c4de6" fill-opacity="0.6"/>
      <path d="M250 760 L410 584 L510 672 L612 596 L780 760 Z" fill="#3b6ef6"/>
    </g>
    <circle cx="512" cy="512" r="232" fill="none" stroke="#3b6ef6" stroke-opacity="0.18" stroke-width="6"/>
  </g>
</svg>
