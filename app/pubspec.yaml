name: gpix_app
description: Cross-platform client for a self-hosted gpix media server.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  file_picker: ^13.4.0
  url_launcher: ^6.3.0
  photo_manager: ^3.2.0
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# App icon source. Regenerate platform icons with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/gpix.png"
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/gpix.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/gpix.png
